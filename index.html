<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HF • Arte e Biju</title>

<style>

body{
margin:0;
font-family:Arial;
background:#fff0f6;
}

/* HEADER */

header{
background:#ff4da6;
color:white;
text-align:center;
padding:25px;
}

header h1{
margin:0;
font-size:28px;
}

/* MENU */

.menu{
display:flex;
justify-content:center;
gap:15px;
background:#ffc0dd;
padding:10px;
flex-wrap:wrap;
}

.menu button{
background:white;
border:none;
padding:10px 20px;
border-radius:20px;
cursor:pointer;
font-weight:bold;
}

.menu button:hover{
background:#ff4da6;
color:white;
}

/* CONTEUDO */

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.produtos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

/* CARD */

.card{
background:white;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
padding:15px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
border-radius:10px;
}

.preco{
color:#ff1493;
font-size:18px;
margin:10px;
}

/* BOTAO */

.botao{
background:#ff4da6;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

/* CARRINHO */

.carrinho{
position:fixed;
bottom:20px;
right:20px;
background:#ff4da6;
color:white;
padding:15px;
border-radius:10px;
}

footer{
background:#ff4da6;
color:white;
text-align:center;
padding:15px;
margin-top:40px;
}

</style>
</head>

<body>

<header>

<h1>HF • ARTE E BIJU</h1>
<p>Acessórios personalizados feitos à mão</p>
<p>📍 Januária - MG</p>

</header>

<div class="menu">

<button onclick="mostrar('pulseiras')">Pulseiras</button>
<button onclick="mostrar('colares')">Colares</button>
<button onclick="mostrar('quadros')">Quadros</button>
<button onclick="mostrar('cordinhas')">Cordinhas de Celular</button>

</div>

<div class="container">

<!-- PULSEIRAS -->

<div id="pulseiras" class="produtos">

<div class="card">
<img src="https://i.imgur.com/Z6X9Y.jpg">
<h3>Pulseira Rosa</h3>
<p class="preco">R$15,00</p>
<button class="botao" onclick="add('Pulseira Rosa')">Adicionar</button>
</div>

<div class="card">
<img src="https://i.imgur.com/Z6X9Y.jpg">
<h3>Pulseira Lilás</h3>
<p class="preco">R$12,00</p>
<button class="botao" onclick="add('Pulseira Lilás')">Adicionar</button>
</div>

</div>


<!-- COLARES -->

<div id="colares" class="produtos" style="display:none">

<div class="card">
<img src="https://i.imgur.com/Z6X9Y.jpg">
<h3>Colar Delicado</h3>
<p class="preco">R$20,00</p>
<button class="botao" onclick="add('Colar Delicado')">Adicionar</button>
</div>

</div>


<!-- QUADROS -->

<div id="quadros" class="produtos" style="display:none">

<div class="card">
<img src="https://i.imgur.com/Z6X9Y.jpg">
<h3>Quadro Personalizado</h3>
<p class="preco">R$35,00</p>
<button class="botao" onclick="add('Quadro Personalizado')">Adicionar</button>
</div>

</div>


<!-- CORDINHAS -->

<div id="cordinhas" class="produtos" style="display:none">

<div class="card">
<img src="https://i.imgur.com/Z6X9Y.jpg">
<h3>Cordinha de Celular</h3>
<p class="preco">R$18,00</p>
<button class="botao" onclick="add('Cordinha de Celular')">Adicionar</button>
</div>

</div>

</div>


<div class="carrinho">

🛒 <span id="itens">0</span> itens

<br><br>

<button class="botao" onclick="comprar()">Finalizar</button>

</div>


<footer>

Instagram: @hf_arteebijus

</footer>


<script>

let carrinho=[]

function add(produto){

carrinho.push(produto)

document.getElementById("itens").innerText=carrinho.length

}

function comprar(){

let msg="Olá! Quero comprar:%0A"

carrinho.forEach(p=>{

msg+="- "+p+"%0A"

})

window.open("https://wa.me/5538991580022?text="+msg)

}

function mostrar(categoria){

document.getElementById("pulseiras").style.display="none"
document.getElementById("colares").style.display="none"
document.getElementById("quadros").style.display="none"
document.getElementById("cordinhas").style.display="none"

document.getElementById(categoria).style.display="grid"

}

</script>

</body>
  </html>
