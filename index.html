<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HF ° BIJUS</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #ffe4ec;
    }

    header {
      background: linear-gradient(90deg, #ff4d88, #ff80aa);
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-btn {
      background: white;
      color: #ff4d88;
      padding: 8px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px 0 5px;
      color: #ff4d88;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
    }

    .btn {
      margin: 10px;
      padding: 8px;
      background: #ff4d88;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .cart {
      position: fixed;
      top: 0;
      right: -300px;
      width: 300px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      padding: 15px;
      transition: 0.3s;
    }

    .cart.active {
      right: 0;
    }

    .checkout {
      margin-top: 10px;
      background: #25D366;
      color: white;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>HF ° BIJUS</h1>
  <div class="cart-btn" onclick="toggleCart()">🛒 (<span id="count">0</span>)</div>
</header>

<div class="container">

  <div class="card">
    <img src="img1.png">
    <h3>Pulseira Macramê</h3>
    <p class="price">R$25,00</p>
    <button class="btn" onclick="add('Pulseira',25)">Adicionar</button>
  </div>

  <div class="card">
    <img src="img2.png">
    <h3>Conjunto Vermelho</h3>
    <p class="price">R$10,00</p>
    <button class="btn" onclick="add('Conjunto',10)">Adicionar</button>
  </div>

  <div class="card">
    <img src="img3.png">
    <h3>Colar Rosa</h3>
    <p class="price">R$15,00</p>
    <button class="btn" onclick="add('Colar',15)">Adicionar</button>
  </div>

  <div class="card">
    <img src="img4.png">
    <h3>Cordinha Rosa</h3>
    <p class="price">R$10,00</p>
    <button class="btn" onclick="add('Cordinha Rosa',10)">Adicionar</button>
  </div>

  <div class="card">
    <img src="img5.png">
    <h3>Cordinha Lilás</h3>
    <p class="price">R$10,00</p>
    <button class="btn" onclick="add('Cordinha Lilás',10)">Adicionar</button>
  </div>

</div>

<div class="cart" id="cart">
  <h2>Carrinho</h2>
  <div id="items"></div>
  <p>Total: R$ <span id="total">0</span></p>
  <button class="checkout" onclick="buy()">Finalizar no WhatsApp</button>
</div>

<script>
let cart = [];

function toggleCart(){
  document.getElementById('cart').classList.toggle('active');
}

function add(name, price){
  cart.push({name, price});
  update();
}

function update(){
  let html = '';
  let total = 0;

  cart.forEach(i => {
    html += `<p>${i.name} - R$${i.price}</p>`;
    total += i.price;
  });

  document.getElementById('items').innerHTML = html;
  document.getElementById('total').innerText = total;
  document.getElementById('count').innerText = cart.length;
}

function buy(){
  let msg = 'Pedido:%0A';

  cart.forEach(i=>{
    msg += `${i.name} - R$${i.price}%0A`;
  });

  msg += `%0ATotal: R$${document.getElementById('total').innerText}`;

  window.open(`https://wa.me/553891580022?text=${msg}`);
}
</script>

</body>
    </html>
