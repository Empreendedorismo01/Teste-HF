<!DOCTYPE html><html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HF ° BIJUS</title>  <style>
    body { margin:0; font-family: Arial; background:#ffe4ec; }

    header {
      background: linear-gradient(90deg,#ff4d88,#ff80aa);
      color:white; padding:15px;
      display:flex; justify-content:space-between; align-items:center;
      position: sticky; top:0; z-index:10;
    }

    /* ÍCONE CARRINHO */
    .cart-icon {
      position: relative;
      font-size: 22px;
      cursor: pointer;
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -10px;
      background: white;
      color: #ff4d88;
      border-radius: 50%;
      font-size: 12px;
      padding: 2px 6px;
      font-weight: bold;
    }

    .container {
      padding:15px;
      display:grid;
      grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
      gap:15px;
    }

    .card {
      background:white; border-radius:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      overflow:hidden; text-align:center;
    }

    .card img { width:100%; height:180px; object-fit:cover; }

    .card h3 { margin:10px 0 5px; color:#ff4d88; }

    .price { font-size:18px; font-weight:bold; }

    .btn {
      margin:10px; padding:8px;
      background:#ff4d88; color:white;
      border:none; border-radius:8px; cursor:pointer;
    }

    /* MODAL CARRINHO */
    .overlay {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.4);
      display:none;
      z-index:20;
    }

    .overlay.active { display:block; }

    .cart-modal {
      position: fixed;
      bottom: -100%;
      left:0;
      width:100%;
      background:white;
      border-radius:20px 20px 0 0;
      padding:15px;
      transition:0.3s;
      z-index:30;
      max-height: 70%;
      display:flex;
      flex-direction:column;
    }

    .cart-modal.active { bottom:0; }

    .cart-items {
      flex:1;
      overflow-y:auto;
      margin-bottom:10px;
    }

    .actions button {
      width:100%;
      margin-top:5px;
      padding:10px;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
    }

    .buy { background:#25D366; color:white; }
    .cancel { background:#ff4d88; color:white; }
    .continue { background:#ddd; }

  </style></head><body><header>
  <h1>HF ° BIJUS</h1>
  <div class="cart-icon" onclick="toggleCart()">
    🛒
    <span class="cart-count" id="count">0</span>
  </div>
</header><div class="container">  <div style="grid-column: 1 / -1; text-align:center; color:#555; font-size:14px; margin-bottom:10px;">
    Para mais variedades, fale com a gente: <br><br>
    <a href="https://wa.me/553891580022" target="_blank" style="display:inline-block; margin:5px; padding:8px 12px; background:#25D366; color:white; border-radius:8px; text-decoration:none; font-weight:bold;">WhatsApp</a>
    <a href="https://instagram.com/hf_arteebijus" target="_blank" style="display:inline-block; margin:5px; padding:8px 12px; background:#ff4d88; color:white; border-radius:8px; text-decoration:none; font-weight:bold;">Instagram @hf_arteebijus</a> 💕
  </div>  <div class="card">
    <img src="img1.png">
    <h3>Pulseira Macramê</h3>
    <p class="price">R$25,00</p>
    <button class="btn" onclick="add('Pulseira',25)">Adicionar</button>
  </div>  <div class="card">
    <img src="img2.png">
    <h3>Conjunto Vermelho</h3>
    <p class="price">R$10,00</p>
    <button class="btn" onclick="add('Conjunto',10)">Adicionar</button>
  </div>  <div class="card">
    <img src="img3.png">
    <h3>Colar Rosa</h3>
    <p class="price">R$15,00</p>
    <button class="btn" onclick="add('Colar',15)">Adicionar</button>
  </div>  <div class="card">
    <img src="img4.png">
    <h3>Cordinha Rosa</h3>
    <p class="price">R$10,00</p>
    <button class="btn" onclick="add('Cordinha Rosa',10)">Adicionar</button>
  </div>  <div class="card">
    <img src="img5.png">
    <h3>Cordinha Lilás</h3>
    <p class="price">R$10,00</p>
    <button class="btn" onclick="add('Cordinha Lilás',10)">Adicionar</button>
  </div></div><div class="overlay" id="overlay" onclick="closeCart()"></div><div class="cart-modal" id="cart">
  <h2>Seu Carrinho</h2>
  <div class="cart-items" id="items"></div>
  <p><strong>Total: R$ <span id="total">0</span></strong></p>  <div class="actions">
    <button class="buy" onclick="buy()">Finalizar Compra</button>
    <button class="continue" onclick="closeCart()">Adicionar mais itens</button>
    <button class="cancel" onclick="clearCart()">Cancelar Pedido</button>
  </div>
</div><script>
let cart = [];

function toggleCart(){
  document.getElementById('cart').classList.add('active');
  document.getElementById('overlay').classList.add('active');
}

function closeCart(){
  document.getElementById('cart').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
}

function add(name, price){
  cart.push({name, price});
  update();
}

function update(){
  let html = '';
  let total = 0;

  cart.forEach(i => {
    html += `<p>${i.name} - R$${i.price}</p>`;
    total += i.price;
  });

  document.getElementById('items').innerHTML = html;
  document.getElementById('total').innerText = total;
  document.getElementById('count').innerText = cart.length;
}

function clearCart(){
  cart = [];
  update();
  closeCart();
}

function buy(){
  let msg = 'Pedido:%0A';

  cart.forEach(i=>{
    msg += `${i.name} - R$${i.price}%0A`;
  });

  msg += `%0ATotal: R$${document.getElementById('total').innerText}`;

  window.open(`https://wa.me/553891580022?text=${msg}`);
}
</script></body>
      </html>
